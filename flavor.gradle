def keystore = file("../sign/chat-pro.jks")
def signProperties = file("../sign/sign.properties")

android {
    signingConfigs {

        debug {
            if (keystore.exists() && signProperties.exists()) {
                Properties props = new Properties()
                props.load(new FileInputStream(signProperties))
                keyAlias props['KEY_ALIAS']
                keyPassword props['KEY_PASSWORD']
                storeFile keystore
                storePassword props['STORE_PASSWORD']
            }

        }

        release {
            if (keystore.exists() && signProperties.exists()) {
                Properties props = new Properties()
                props.load(new FileInputStream(signProperties))
                keyAlias props['KEY_ALIAS']
                keyPassword props['KEY_PASSWORD']
                storeFile keystore
                storePassword props['STORE_PASSWORD']
            }

        }

    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
            //禁用PNG压缩
            crunchPngs false
        }
        release {
            signingConfig signingConfigs.release
            zipAlignEnabled true
            //启用代码压缩、混淆、优化（R8）
            //注意：只对 app 模块开启；库模块若也开启，会先用 R8 裁剪 AAR，
            //     把只在运行时反射使用的类裁掉，反而导致 App 崩溃
            minifyEnabled project.name == "app"
            //资源压缩只支持 application 模块，库模块设置会报错
            if (project.name == "app") {
                shrinkResources true
            }
            //ProGuard规则文件
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

//    lintOptions {
//        abortOnError false
//    }
}

def isIndependent() {
    //是app module
    if (this.name == "app") {
        println("application module , this.name = ${this.name}")
        return true
    } else {
        println("library module , this.name = ${this.name}")
        return false
    }
}
