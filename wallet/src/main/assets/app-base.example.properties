# ============================================================
# app-base.properties 模板（真实文件不入库）
# 用法：复制为同目录下的 app-base.properties，填入你自己的兑换服务地址与凭证。
# ⚠️ EXCHANGE_TOKEN 是 Basic 认证串，属于账号凭证，只放本机。
# ============================================================

# 兑换服务
EXCHANGE_MANAGER=https://exchange.example.com
EXCHANGE_DO=https://exchange.example.com

# Basic 认证串（Base64(user:password)）
EXCHANGE_TOKEN=
