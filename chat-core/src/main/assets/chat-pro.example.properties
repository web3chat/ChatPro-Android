# ============================================================
# chat-pro.properties 模板（真实文件不入库，见 .gitignore）
#
# 用法：复制成同目录下的 chat-pro.properties，再填入自己的值
#   cp chat-pro.example.properties chat-pro.properties
#
# ⚠️ 这是整个 App 的中枢配置：所有服务端地址和「代扣私钥」都在这里，
#    真实文件只留在本机，永远不要提交。
# ============================================================

PAGE_SIZE=20
MAX_AUDIO_DURATION=60

# 代扣地址私钥（64 位十六进制）。留空 = 不启用代扣功能。
# ⚠️ 一旦泄露等于交出该地址的全部资产，务必只放本机。
NO_BALANCE_PRIVATE_KEY=

# 通话房间（dtalk H5）服务地址，留空 = 通话入口不可用
CALL_SERVER=https://call.example.com

# 消息 / 文件加密开关
ENCRYPT=true
FILE_ENCRYPT=true

# ---------- 服务端地址：换成你自己的部署 ----------
# PHP 接口
BASE_URL=https://chat.example.com
BASE_URL_NCHAT=https://chat.example.com
BASE_URL_CIP=https://chat.example.com
BASE_URL_TEST=http://127.0.0.1:8056

# GO 接口
GO_URL=https://api.example.com
GO_URL_NCHAT=https://api.example.com
GO_URL_CIP=https://api.example.com
GO_URL_TEST=http://127.0.0.1:8058

# 中心化服务（发现 / 更新等）
CENTRALIZED_SERVER=https://chat.example.com
CENTRALIZED_SERVER_NCHAT=https://chat.example.com
CENTRALIZED_SERVER_CIP=https://chat.example.com
CENTRALIZED_SERVER_TEST=http://127.0.0.1:8061

# GO 新服务
GO_NEW_SERVER=http://127.0.0.1:8080
GO_NEW_SERVER_NCHAT=http://127.0.0.1:8080
GO_NEW_SERVER_CIP=http://127.0.0.1:8061
GO_NEW_SERVER_TEST=http://127.0.0.1:8061

# 下载页
DOWNLOAD_URL=https://example.com
DOWNLOAD_URL_NCHAT=https://example.com
DOWNLOAD_URL_CIP=https://example.com
DOWNLOAD_URL_TEST=http://127.0.0.1:8058

# 扫码登录服务器（PC 网页版扫码登录）
QR_LOGIN_SERVER=https://example.com
QR_LOGIN_SERVER_NCHAT=https://example.com
QR_LOGIN_SERVER_CIP=https://example.com
QR_LOGIN_SERVER_TEST=http://127.0.0.1:8041

# 扫码登录 ECDH v2 开关：false = 只认老格式 qr-login；true = 同时支持 qr-login-v2
QR_LOGIN_ECDH=false

# 私聊聊天记录本地化：true = 从本地库加载（秒开），false = 每次拉服务端历史
PRI_CHAT_LOCAL=true

# 崩溃兜底展示页
CRASH_DIALOG=true

# 启动时预请求相册（存储）权限
AUTO_REQUEST_STORAGE=true

# 谈信广场服务器（C 端前缀默认 /square/app）
SQUARE_SERVER=https://square.example.com
SQUARE_SERVER_NCHAT=https://square.example.com
SQUARE_SERVER_CIP=https://square.example.com
SQUARE_SERVER_TEST=https://square.example.com

# 仅 debug 构建联调使用（release 忽略），留空则回落上面正式地址
SQUARE_SERVER_DEBUG=

# 广场接口路径前缀（反向代理后缀）
SQUARE_PATH=/square/app
