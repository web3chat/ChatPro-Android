# ============================================================
# 本机私有凭证（真实文件不入库，见 .gitignore）
# 用法：复制为仓库根目录的 local.secrets.properties 并填入真实值
# ============================================================

# Bugly mapping 上传凭证（在 Bugly 后台 → 产品设置 → 产品信息里查看）
# 不配置时打包任务会自动跳过上传
BUGLY_CHAT33PRO_APPID=
BUGLY_CHAT33PRO_APPKEY=

BUGLY_ORGINONE_APPID=
BUGLY_ORGINONE_APPKEY=

BUGLY_POLICE_APPID=
BUGLY_POLICE_APPKEY=

BUGLY_ZHCHAT_APPID=
BUGLY_ZHCHAT_APPKEY=

# 本地加密默认口令（CipherUtils.DEFAULT_PASSWORD）
# 不配置时使用占位值，无法解开以真实口令加密的本地助记词；老版本数据建议填回原值
DEFAULT_CIPHER_PASSWORD=
